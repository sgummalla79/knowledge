apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-api
  namespace: knowledge
  annotations:
    # References deploy/k3s/06-cluster-issuer.yaml -- cert-manager watches for this annotation
    # and creates/renews the Certificate automatically, no separate Certificate resource needed.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # References api/deploy/k3s/04-middleware.yaml -- <namespace>-<name>@kubernetescrd is
    # Traefik's required format for pointing a plain Ingress at one of its own CRD-defined
    # middlewares.
    traefik.ingress.kubernetes.io/router.middlewares: knowledge-strip-knowledge-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["api.sgummallaworks.com"]
      secretName: api-sgummallaworks-com-tls
  rules:
    - host: api.sgummallaworks.com
      http:
        paths:
          - path: /knowledge
            pathType: Prefix
            backend:
              service:
                name: knowledge-api
                port: { number: 13102 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-webui
  namespace: knowledge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["knowledge.sgummallaworks.com"]
      secretName: knowledge-sgummallaworks-com-tls
  rules:
    - host: knowledge.sgummallaworks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledge-webui
                port: { number: 80 }
