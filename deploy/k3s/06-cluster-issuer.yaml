# ClusterIssuer, not a namespaced Issuer -- shared across every namespace on this cluster (any
# future app on this box can reference the same one), unlike the rest of the knowledge-namespaced
# resources (split across api/deploy/k3s/ and this directory -- see docs/HOSTINGER_DEPLOY.md).
# Apply once per cluster, not once per app.
#
# ingressClassName assumes k3s's default Traefik IngressClass is named "traefik" (true for a
# stock k3s install with no --disable traefik override) -- verify with `kubectl get ingressclass`
# if the HTTP01 challenge fails to solve.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sgummalla.work@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
