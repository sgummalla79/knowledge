services:
  knowledge-db:
    image: pgvector/pgvector:pg16
    container_name: knowledge-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rag-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # This compose file lives in deploy/, but the build needs the repo root (Dockerfile COPYs
    # api/, VERSION, etc.) — context is relative to this file's own directory, dockerfile is
    # relative to that context.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Explicit "prod" tag so it reads clearly in `docker images` instead of relying on the
    # implicit ":latest" default — distinct from the ":testing" tag built by
    # docker-compose.test.yml.
    image: knowledge:prod
    container_name: knowledge
    depends_on:
      knowledge-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@knowledge-db:5432/${POSTGRES_DB:-rag}
      SECRET_KEY: ${SECRET_KEY}
      PORT: ${PORT:-13102}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # 13102: same 13100 series as rag-desktop's dev ports (13100 vite, 13101 HMR) —
      # keeps every port this project touches in one clearly-distinct block.
      - "${PORT:-13102}:${PORT:-13102}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rag-db-data:
