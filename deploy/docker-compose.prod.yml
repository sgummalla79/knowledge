# The real Hostinger deployment — see docs/HOSTINGER_DEPLOY.md for the full setup walkthrough.
# Three services: caddy (the only one reachable from outside this box — reverse proxy, TLS,
# static webui serving), knowledge-api (the published Docker Hub image, pinned to a specific
# version — never :latest, so `docker compose pull` never silently upgrades), knowledge-db
# (Postgres/pgvector, data-only, no host port).
services:
  knowledge-db:
    image: pgvector/pgvector:pg16
    container_name: knowledge-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - knowledge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  knowledge-api:
    image: sgummalla/knowledge:${KNOWLEDGE_VERSION:?set KNOWLEDGE_VERSION in .env, e.g. 4.3.1 -- never :latest here}
    container_name: knowledge-api
    depends_on:
      knowledge-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD}@knowledge-db:5432/${POSTGRES_DB:-knowledge}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Real TLS terminates at Caddy in front of this container -- see api/config.py's own comment
      # on why this must be explicit rather than left at its plain-HTTP-safe default.
      SESSION_COOKIE_SECURE: "true"
      WEBUI_ORIGINS: https://knowledge.sgummallaworks.com
    # No `ports:` -- only reachable from caddy, over the compose network. Never expose 13102 to
    # the host directly; api.sgummallaworks.com/knowledge is the only sanctioned way in.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:13102/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
      args:
        VITE_API_BASE_URL: https://api.sgummallaworks.com/knowledge
    image: knowledge-caddy:prod
    container_name: knowledge-caddy
    depends_on:
      knowledge-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt certs/account state and Caddy's own runtime config -- must persist across
      # restarts or every restart re-issues certs (Let's Encrypt rate-limits repeat issuance).
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  knowledge-db-data:
  caddy-data:
  caddy-config:
