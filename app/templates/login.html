{% extends "base.html" %}
{% block title %}Log in — Knowledge{% endblock %}
{% block content %}
<div class="login-brand">
  <span class="brand-icon" aria-hidden="true">
    <img src="{{ url_for('static', filename='brand-icon.png') }}" alt="">
  </span>
  <span class="brand-name">Knowledge</span>
</div>
<p class="subtitle" style="text-align: center;">Sign in to manage registered applications.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" required autocomplete="username" autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
{% endblock %}
