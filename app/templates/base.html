<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0; margin: 0; padding: 40px 20px;
    }
    .card { max-width: 480px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; }
    .card.wide { max-width: 900px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.subtitle { color: #94a3b8; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
    input[type=text], input[type=password], input[type=number] {
      width: 100%; padding: 8px 10px; margin-bottom: 16px; border-radius: 6px;
      border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px;
    }
    button, .btn {
      display: inline-block; padding: 8px 16px; border-radius: 6px; border: none;
      background: #3b82f6; color: white; font-size: 13px; cursor: pointer; text-decoration: none;
    }
    button.secondary { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
    button.danger { background: #ef4444; }
    .error { background: #451a1a; border: 1px solid #7f1d1d; color: #fca5a5; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #334155; vertical-align: top; }
    th { color: #94a3b8; font-weight: 600; }
    .link-btn {
      display: inline; background: none; border: none; padding: 0; margin-left: 8px;
      color: #60a5fa; font-size: 12px; cursor: pointer; text-decoration: underline;
    }
    .link-btn:hover { color: #93c5fd; }
    .scope-list { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 8px 0 16px; }
    .scope-list label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; color: #e2e8f0; }
    .scope-list input { margin: 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
    .badge.active { background: #052e1f; color: #86efac; }
    .badge.revoked { background: #451a1a; color: #fca5a5; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-group form { display: inline-block; }
    .btn-group button { padding: 5px 10px; font-size: 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    .info-icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%; margin-left: 6px; vertical-align: middle;
      background: #334155; color: #cbd5e1; border: none; font-size: 11px; font-style: italic;
      font-weight: 700; padding: 0; cursor: pointer;
    }
    .info-icon-btn:hover { background: #475569; }
    .popup-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    /* The [hidden] attribute selector (specificity 0,1,0) doesn't reliably beat the class rule
       above (also 0,1,0, but declared later) — without this, "display: flex" wins regardless of
       the hidden attribute, so the popup shows on load and never visually closes. */
    .popup-overlay[hidden] { display: none; }
    .popup { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; max-width: 420px; width: 90%; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
    .popup-close { background: none; border: none; color: #94a3b8; font-size: 20px; line-height: 1; padding: 0; cursor: pointer; }
    .popup ul { margin: 0; padding-left: 18px; font-size: 13px; color: #e2e8f0; }
    .popup li { margin-bottom: 4px; }
    .popup-field { margin: 0 0 12px; font-size: 13px; color: #e2e8f0; }
    .popup-field code { display: inline-block; margin-top: 2px; word-break: break-all; background: #0f172a; padding: 4px 6px; border-radius: 4px; font-size: 12px; }
    .popup-hint { color: #94a3b8; font-size: 12px; }
    .copy-row { display: flex; align-items: center; gap: 6px; }
    .copy-row code { flex: 1; min-width: 0; }
    .copy-btn {
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; border-radius: 5px; margin-top: 2px;
      background: #334155; border: none; color: #cbd5e1; cursor: pointer;
    }
    .copy-btn:hover { background: #475569; }
    .copy-btn.copied { background: #14532d; color: #86efac; }
    .copy-btn svg { width: 13px; height: 13px; display: block; }
  </style>
</head>
<body>
  <div class="{% block card_class %}card{% endblock %}">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
