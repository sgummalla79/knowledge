{% extends "base.html" %}
{% block title %}Change password — Knowledge{% endblock %}
{% block content %}
<h1>Set a new password</h1>
<p class="subtitle">You're using the default password — choose a new one before continuing.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="new_password">New password</label>
  <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password" autofocus>
  <label for="confirm_password">Confirm password</label>
  <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
  <button type="submit">Set password</button>
</form>
{% endblock %}
