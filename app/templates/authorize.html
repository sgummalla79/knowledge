{% extends "base.html" %}
{% block title %}Authorize — Knowledge{% endblock %}
{% block content %}
<div class="login-brand">
  <span class="brand-icon" aria-hidden="true">
    <img src="{{ url_for('static', filename='brand-icon.png') }}" alt="">
  </span>
  <span class="brand-name">Knowledge</span>
</div>
<h1>Authorize {{ application.name }}</h1>
<p class="subtitle">This application is requesting the following access to your Knowledge libraries:</p>
<div class="scope-list">
  {% for scope in params.scope %}
    <span class="scope-tag">{{ scope }}</span>
  {% endfor %}
</div>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="response_type" value="{{ params.response_type }}">
  <input type="hidden" name="client_id" value="{{ params.client_id }}">
  <input type="hidden" name="redirect_uri" value="{{ params.redirect_uri }}">
  <input type="hidden" name="scope" value="{{ params.scope | join(' ') }}">
  <input type="hidden" name="state" value="{{ params.state }}">
  <input type="hidden" name="code_challenge" value="{{ params.code_challenge }}">
  <input type="hidden" name="code_challenge_method" value="{{ params.code_challenge_method }}">
  <div class="btn-group">
    <button type="submit" name="action" value="approve">Approve</button>
    <button type="submit" name="action" value="deny" class="secondary">Deny</button>
  </div>
</form>
{% endblock %}
