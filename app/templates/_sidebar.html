<aside class="sidebar">
  <div class="sidebar-top">
    <a class="brand" href="{{ url_for('auth_ui.dashboard') }}">
      <span class="brand-icon" aria-hidden="true">
        <img src="{{ url_for('static', filename='brand-icon.png') }}" alt="">
      </span>
      <span class="brand-name">Knowledge</span>
    </a>
    <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar-panel" aria-label="Toggle menu">
      <svg class="menu-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M3 5.5h14M3 10h14M3 14.5h14"/>
      </svg>
    </button>
  </div>

  <div class="sidebar-panel" id="sidebar-panel">
    <nav class="sidebar-nav">
      <div class="nav-group-label">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <rect x="1.75" y="1.75" width="5.25" height="5.25" rx="1"/>
          <rect x="9" y="1.75" width="5.25" height="5.25" rx="1"/>
          <rect x="1.75" y="9" width="5.25" height="5.25" rx="1"/>
          <rect x="9" y="9" width="5.25" height="5.25" rx="1"/>
        </svg>
        Clients
      </div>
      <a href="{{ url_for('auth_ui.register_application_page') }}" class="nav-sub {{ 'active' if request.endpoint in ['auth_ui.register_application_page', 'auth_ui.register_application'] }}">
        Register
      </a>
      <a href="{{ url_for('auth_ui.dashboard') }}" class="nav-sub {{ 'active' if request.endpoint == 'auth_ui.dashboard' }}">
        Credentials
      </a>
      <a href="{{ url_for('auth_ui.configuration') }}" class="{{ 'active' if request.endpoint == 'auth_ui.configuration' }}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <circle cx="8" cy="8" r="2.1"/>
          <path d="M8 1.6v1.7M8 12.7v1.7M14.4 8h-1.7M3.3 8H1.6M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2M12.4 12.4l-1.2-1.2M4.8 4.8 3.6 3.6"/>
        </svg>
        Configuration
      </a>
      <a href="{{ url_for('auth_ui.api_docs') }}" class="{{ 'active' if request.endpoint == 'auth_ui.api_docs' }}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <path d="M4 1.5h5.5L12 4v9.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5Z"/>
          <path d="M9.5 1.5V4a.5.5 0 0 0 .5.5h2"/>
          <path d="M4.75 7.5h4.5M4.75 9.75h4.5M4.75 5.25h2"/>
        </svg>
        API Documentation
      </a>
      <a href="{{ url_for('auth_ui.schema') }}" class="{{ 'active' if request.endpoint == 'auth_ui.schema' }}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <rect x="1.75" y="1.75" width="12.5" height="3.5" rx="0.75"/>
          <rect x="1.75" y="6.25" width="12.5" height="3.5" rx="0.75"/>
          <rect x="1.75" y="10.75" width="12.5" height="3.5" rx="0.75"/>
        </svg>
        Data Model
      </a>
    </nav>
    <div class="sidebar-footer">
      <form method="post" action="{{ url_for('auth_ui.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="secondary">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
            <path d="M6.5 1.75H3.75a1 1 0 0 0-1 1v10.5a1 1 0 0 0 1 1H6.5"/>
            <path d="M10.25 11 13.25 8l-3-3"/>
            <path d="M13.25 8H6"/>
          </svg>
          Log out
        </button>
      </form>
    </div>
  </div>
</aside>

<script>
  (function () {
    var toggle = document.getElementById("menu-toggle");
    var panel = document.getElementById("sidebar-panel");
    if (!toggle || !panel) return;
    toggle.addEventListener("click", function () {
      var isOpen = panel.classList.toggle("open");
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    // A nav click navigates away (new page load resets state anyway), but closing immediately
    // avoids a flash of the open panel over the outgoing page during the transition.
    panel.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        panel.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      });
    });
  })();
</script>
