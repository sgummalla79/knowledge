apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-api
  namespace: knowledge
spec:
  # Bumped from 1 (this app's ingestion-worker Release 2, see session history): job status used to
  # live in an in-memory dict scoped to one process, which is exactly what pinned this to a single
  # replica -- ingestion now runs in its own standalone process (api/deploy/k3s/
  # 07-ingestion-worker.yaml) reading/writing Postgres instead, so this constraint is gone.
  replicas: 2
  # Recreate -> RollingUpdate: real redundancy (one pod restarting -- a crash, an OOM, a node
  # hiccup -- no longer means total outage) and zero-downtime deploys, now that this Deployment
  # has no in-memory state that would fragment across an overlapping old/new pod during rollout.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: knowledge-api }
  template:
    metadata:
      labels: { app: knowledge-api }
    spec:
      containers:
        - name: knowledge-api
          # Bump this tag to upgrade -- check docker.io/sgummalla/knowledge/tags or this repo's
          # api/VERSION file for the current one, then `kubectl apply -f` this file again.
          image: sgummalla/knowledge:4.7.4
          ports:
            - containerPort: 13102
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # 1Gi was too tight for a large file upload -- the raw bytes are held in memory
            # multiple times over across one request (WSGI body buffer, the parsed multipart file,
            # the route handler's own read(), and the DB bind parameter) across 3 gunicorn workers
            # sharing this one limit; a real ~80MB upload OOM-killed the container at 1Gi
            # (confirmed via `kubectl describe pod`, exit code 137) -- see this repo's CLAUDE.md
            # session history for the investigation that found it.
            limits: { cpu: "1", memory: 2Gi }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: knowledge-secrets, key: database-url }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: knowledge-secrets, key: secret-key }
            - name: LOG_LEVEL
              value: INFO
            # Real TLS terminates at Traefik in front of this pod -- see api/config.py's own
            # comment on why this must be explicit rather than left at its plain-HTTP-safe default.
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: WEBUI_ORIGINS
              value: https://knowledge.sgummallaworks.com
          readinessProbe:
            httpGet: { path: /health, port: 13102 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 13102 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-api
  namespace: knowledge
spec:
  selector: { app: knowledge-api }
  ports:
    - port: 13102
      targetPort: 13102
