apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-db-data
  namespace: knowledge
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-db
  namespace: knowledge
spec:
  replicas: 1
  # local-path PVCs are node-local, not shared storage -- a second replica (or a rolling update
  # that briefly runs two pods) could schedule onto a different node and get an empty volume.
  # Recreate guarantees the old pod is fully gone before the new one starts, never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: knowledge-db }
  template:
    metadata:
      labels: { app: knowledge-db }
    spec:
      containers:
        - name: knowledge-db
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # 1Gi wasn't enough for a large upload's INSERT (ingestion_jobs.payload holds the raw
            # file bytes as one value) -- confirmed via this pod's own logs: a 109MB upload OOM-
            # killed a Postgres backend process, which crashes the whole instance into WAL recovery
            # ("database system was not properly shut down; automatic recovery in progress"),
            # killing every other connection too, not just this one request. Not just a failed
            # upload -- a real availability incident for the whole app during recovery. Raised to
            # 2Gi; this box has 7.8Gi total (see api/deploy/k3s/07-ingestion-worker.yaml's own
            # comment on the same tradeoff -- a ceiling this pod grows into when it needs it, not a
            # reservation, costs nothing at idle).
            limits: { cpu: "1", memory: 2Gi }
          env:
            - name: POSTGRES_DB
              value: knowledge
            - name: POSTGRES_USER
              value: knowledge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: knowledge-secrets, key: postgres-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "knowledge"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "knowledge"] }
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: knowledge-db-data }
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-db
  namespace: knowledge
spec:
  selector: { app: knowledge-db }
  ports:
    - port: 5432
      targetPort: 5432
