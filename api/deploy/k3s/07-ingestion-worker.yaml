apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-ingestion-worker
  namespace: knowledge
spec:
  # Release 2 cutover (see session history): the API's document_service.py no longer spawns
  # threading.Thread at all -- start_ingestion/start_retry/start_crawl only enqueue a queued row
  # and return, so this is now the only thing that ever processes one. Safe at replicas > 1 too if
  # ever needed: claim_next_queued()'s FOR UPDATE SKIP LOCKED lets multiple replicas claim
  # different rows concurrently without double-processing (proven by a dedicated concurrency test,
  # api/tests/integration/test_ingestion_job_repository.py).
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: knowledge-ingestion-worker }
  template:
    metadata:
      labels: { app: knowledge-ingestion-worker }
    spec:
      containers:
        - name: knowledge-ingestion-worker
          # Same published image as knowledge-api (02-api.yaml) -- keep these two tags in sync on
          # every bump, since both run from the exact same source tree.
          image: sgummalla/knowledge:4.7.3
          # Bypasses api/deploy/entrypoint.sh (and its `alembic upgrade head` step) entirely --
          # migrations stay owned by the API Deployment only. If both Deployments' entrypoints ran
          # `alembic upgrade head` and were applied together, nothing stops two concurrent alembic
          # invocations from racing against the same database (Alembic has no built-in advisory
          # lock for this).
          command: ["python", "-m", "api.ingestion_worker.main"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # 2Gi (matched to 02-api.yaml's own bump) still wasn't enough once this process
            # actually got to parsing/chunking/embedding a large PDF, not just holding its raw
            # bytes -- OOM-killed at anon-rss ~2.04GB (confirmed via `dmesg`'s cgroup OOM report)
            # processing a real ~80MB file. 4Gi gives ~2x headroom over that measured usage rather
            # than another guess; a much larger file nearer MAX_REQUEST_BODY_MB (300MB) could still
            # exceed this and would need revisiting rather than assuming this scales linearly.
            limits: { cpu: "1", memory: 4Gi }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: knowledge-secrets, key: database-url }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: knowledge-secrets, key: secret-key }
            - name: LOG_LEVEL
              value: INFO
            # DB_IDLE_IN_TRANSACTION_TIMEOUT_MS_DEFAULT (30s, api/constants.py) exists to catch a
            # web request's session stalling mid-transaction unexpectedly -- a real incident there.
            # This process's own ingest pipeline legitimately holds one transaction open across
            # PDF parsing, chunking, and calling the embedding provider once per chunk, none of
            # which touch the DB -- for a large document with many chunks that "idle" stretch alone
            # can exceed 30s, and Postgres was confirmed force-closing the connection mid-job
            # (psycopg2.OperationalError: server closed the connection unexpectedly, crashing the
            # whole worker process) well before anything was actually stuck. Overridden here, not
            # in the default, since the API's own web-request sessions should keep the tight 30s --
            # this long an "idle" stretch would be a real bug there, not expected behavior.
            - name: DB_IDLE_IN_TRANSACTION_TIMEOUT_MS
              value: "900000"
