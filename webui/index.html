<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SVG favicon is theme-adaptive (embedded prefers-color-scheme CSS — black glyph on a
         light tab bar, white on a dark one); the .ico is a fixed-color fallback for browsers
         that don't support SVG favicons. The ?v=2 query string is a deliberate cache-bust:
         these two paths existed with no file behind them for a while (see this repo's CLAUDE.md
         session history), and Chrome's per-origin favicon cache is notoriously sticky — it can
         keep serving whatever it first resolved (including a stale/fallback state) from cache
         indefinitely, ignoring normal reloads. Bump this query string again if a future favicon
         change doesn't show up. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap"
    />
    <title>Knowledge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
